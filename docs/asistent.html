<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Asistent — Ferti Shop (probna verzija)</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<!-- LINK ZA TESTERE (vlasnik 15.11.2026): ferti-shop.com/asistent?t=KOD — samo chatbot preko celog ekrana, i na telefonu.
     Kod t ide chatbotu: razgovor dobija oznaku „tester” i ništa ne upisuje u CRM (lid, telefon, ime). Strana nije u meniju ni u sitemap-u. -->
<style>
  :root { --tamna: #14301f; --list: #4e9f3d; --zuta: #c9cc3f; --krem: #f4f7ef; }
  html, body { margin: 0; height: 100%; background: var(--krem); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .okvir { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  .traka { flex: 0 0 auto; background: var(--tamna); color: #fff; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
    font-size: 15px; line-height: 1.35; border-bottom: 3px solid var(--zuta); }
  .traka b { color: var(--zuta); font-weight: 600; }
  iframe { flex: 1 1 auto; width: 100%; border: 0; display: block; background: #fff; }
  .greska { display: none; padding: 24px 16px; color: var(--tamna); }
</style>
</head>
<body>
<div class="okvir">
  <div class="traka"><b>Probna verzija</b> – pitajte šta vas zanima o đubrenju i proizvodima, ocenite odgovor zvezdicama.</div>
  <iframe id="chat" title="Asistent Ferti Shop" allow="geolocation"></iframe>
  <div class="greska" id="greska">Asistent trenutno ne odgovara. Pokušajte ponovo za minut ili pozovite +381 69 201 2001.</div>
</div>
<script>
  (function () {
    var t = null;
    try { var v = new URLSearchParams(location.search).get('t'); if (v && /^[A-Za-z0-9_-]{1,40}$/.test(v)) t = v; } catch (e) { /* stariji pregledač */ }
    var adresa = 'https://tranzit-eu.onrender.com/chat?jezik=sr' + (t ? '&t=' + encodeURIComponent(t) : '');
    var f = document.getElementById('chat');
    var stiglo = false;
    f.addEventListener('load', function () { stiglo = true; });
    f.src = adresa;
    // server na besplatnom planu se budi i do minut — tek posle toga poruka o grešci
    setTimeout(function () { if (!stiglo) { document.getElementById('greska').style.display = 'block'; } }, 70000);
  })();
</script>
</body>
</html>
