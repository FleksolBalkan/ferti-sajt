    <!-- FS4/FS5 (vlasnik 10.11.2026): baner + obrazac „Zatražite ponudu” — isti deo u prozoru (osnova.html) i na strani /ponuda (ponuda.html).
         {{PP_H}} = h2 u prozoru, h1 na strani; {{PP_OBRAZAC}} = prozor | strana (izvor_detalj u CRM-u); slika po jeziku: pp_baner u jezici.json -->
    <picture class="ponuda-prozor__baner">
      <source type="image/webp" srcset="{{KOREN}}{{T:pp_baner}}-800.webp 800w, {{KOREN}}{{T:pp_baner}}-1280.webp 1280w" sizes="(max-width: 880px) 100vw, 880px">
      <img src="{{KOREN}}{{T:pp_baner}}-1280.jpg" srcset="{{KOREN}}{{T:pp_baner}}-800.jpg 800w, {{KOREN}}{{T:pp_baner}}-1280.jpg 1280w" sizes="(max-width: 880px) 100vw, 880px" width="1672" height="941" alt="{{T:pp_baner_opis}}" decoding="async" {{PP_SLIKA}}>
    </picture>
    <div class="ponuda-prozor__telo">
      <p class="ponuda-prozor__oznaka">{{T:pp_oznaka}}</p>
      <{{PP_H}} id="pp-naslov">{{T:pp_naslov}}</{{PP_H}}>
      <p class="ponuda-prozor__podnaslov">{{T:pp_podnaslov}}</p>
      <form class="upit upit--prozor" data-upit data-izvor="landing" data-obrazac="{{PP_OBRAZAC}}" data-jezik="{{JEZIK}}" data-hvala="{{T:f_hvala}}" data-greska="{{T:f_greska}}" data-obavezno="{{T:f_obavezno}}" data-salje="{{T:f_salje}}" novalidate>
        <div class="upit__polja">
          <label>{{T:f_ime}} *<input name="ime" autocomplete="name" required maxlength="80"></label>
          <label>{{T:f_tel}} *<input name="telefon" type="tel" autocomplete="tel" inputmode="tel" required maxlength="40"></label>
          <label>{{T:f_mesto}}<input name="mesto" autocomplete="address-level2" maxlength="80"></label>
          <label>{{T:f_ha}}<input name="ha" type="number" min="0" step="1" inputmode="decimal"></label>
        </div>
        <div class="upit__red">
          <fieldset class="upit__proizvodi"><legend>{{T:f_proizvodi}}</legend>
            <label><input type="checkbox" name="proizvodi" value="UAN"> UAN</label>
            <label><input type="checkbox" name="proizvodi" value="APP"> APP 11-37</label>
            <label><input type="checkbox" name="proizvodi" value="KTS"> KTS</label>
          </fieldset>
{{PP_KULTURA}}
          <label class="upit__kada">{{T:f_kada}}<select name="kada" data-meseci="{{T:f_meseci}}"><option value="">{{T:f_kada_prazno}}</option></select></label>
        </div>
        <label class="upit__pristanak"><input type="checkbox" name="pristanak"> {{T:f_pristanak}}</label>
        <div class="upit__zamka" aria-hidden="true"><label>Adresa sajta<input name="sajt_adresa" tabindex="-1" autocomplete="off"></label></div>
        <div class="upit__kraj">
          <button class="dugme dugme--zuto" type="submit">{{T:f_posalji}}</button>
          <a class="ponuda-prozor__poziv" href="tel:+381692012001">{{T:f_pozovite}}</a>
        </div>
        <p class="upit__poruka" role="status" aria-live="polite"></p>
      </form>
    </div>
